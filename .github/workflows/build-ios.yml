name: build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swiftc --version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Type-check our app
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -typecheck -sdk "$SDK" -target arm64-apple-ios16.0 \
                 Probe/main.swift Probe/ProbeMinimal.swift

      - name: Build our app (unsigned IPA)
        run: ./scripts/build_minimal.sh

      - name: Upload our app
        uses: actions/upload-artifact@v4
        with:
          name: Probe-ipa
          path: out/Probe-minimal.ipa
